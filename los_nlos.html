<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>mmWave Handover Interactive Simulation</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b1120; color: #f8fafc; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    h2 { margin: 4px 0 16px 0; font-size: 22px; color: #38bdf8; text-align: center; }
    .container { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 920px; }
    
    .card { background: #1e293b; border-radius: 12px; padding: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid #334155; }
    canvas#scene { width: 100%; height: 280px; background: #070d19; border-radius: 8px; display: block; cursor: grab; }
    canvas#scene.dragging { cursor: grabbing; }
    
    .instruction { font-size: 13px; color: #94a3b8; text-align: center; margin-top: 6px; }
    .dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; }
    .stat-box { background: #0b1120; border-radius: 8px; padding: 10px; border: 1px solid #334155; text-align: center; }
    .stat-label { font-size: 11px; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.5px; }
    .stat-val { font-size: 17px; font-weight: bold; margin-top: 4px; }

    .chart-container { position: relative; height: 230px; width: 100%; }
    .controls { display: flex; justify-content: center; gap: 12px; margin-top: 10px; }
    button { background: #0284c7; color: white; border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button:hover { background: #0369a1; }
  </style>
</head>
<body>

  <h2>Interactive Blockage & Handover Simulation</h2>

  <div class="container">
    <!-- Visual Canvas Card -->
    <div class="card">
      <canvas id="scene" width="900" height="280"></canvas>
      <div class="instruction">✋ <strong>Drag the Obstacle</strong> into the BS 1 beam path to trigger dynamic NLOS blockage and handover to BS 2.</div>

      <div class="dashboard">
        <div class="stat-box">
          <div class="stat-label">Active Connection</div>
          <div id="stat-active" class="stat-val" style="color: #38bdf8;">Base Station 1</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">BS 1 Power (Closer)</div>
          <div id="stat-bs1" class="stat-val" style="color: #0284c7;">-63.0 dBm</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">BS 2 Power (Farther)</div>
          <div id="stat-bs2" class="stat-val" style="color: #f59e0b;">-76.0 dBm</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Channel Condition</div>
          <div id="stat-channel" class="stat-val" style="color: #22c55e;">LOS (Clear)</div>
        </div>
      </div>
    </div>

    <!-- Real-time Plot Card -->
    <div class="card">
      <div class="chart-container">
        <canvas id="chartCanvas"></canvas>
      </div>
      <div class="controls">
        <button id="resetBtn" style="background: #475569;">Reset Obstacle Position</button>
      </div>
    </div>
  </div>

  <script>
    // --- Layout Setup ---
    // Receiver (UE) centered in canvas (900x280)
    const UE  = { x: 450, y: 140, name: "UE (Receiver)" };
    
    // BS1 is closer to UE: distance ~ 233 px -> stronger nominal power
    const BS1 = { x: 220, y: 100, name: "BS 1 (Closer)", basePower: -63.0 };
    
    // BS2 is farther from UE: distance ~ 335 px -> lower nominal power
    const BS2 = { x: 780, y: 80,  name: "BS 2 (Farther)", basePower: -76.0 };

    // Interactive Obstacle
    let obstacle = { x: 335, y: 220, radius: 18 };
    let isDragging = false;
    let dragOffset = { x: 0, y: 0 };
    let activeBS = 1;

    // --- Continuous Live Plot Setup ---
    const MAX_POINTS = 80;
    const labels = Array(MAX_POINTS).fill("");
    const dataBS1 = Array(MAX_POINTS).fill(-63.0);
    const dataBS2 = Array(MAX_POINTS).fill(-76.0);

    const ctxChart = document.getElementById("chartCanvas").getContext("2d");
    const chart = new Chart(ctxChart, {
      type: "line",
      data: {
        labels: labels,
        datasets: [
          {
            label: "BS 1 Signal Power (dBm)",
            data: dataBS1,
            borderColor: "#0284c7",
            backgroundColor: "#0284c7",
            borderWidth: 2.5,
            pointRadius: 0,
            tension: 0.2
          },
          {
            label: "BS 2 Signal Power (dBm)",
            data: dataBS2,
            borderColor: "#f59e0b",
            backgroundColor: "#f59e0b",
            borderWidth: 2,
            borderDash: [5, 4],
            pointRadius: 0,
            tension: 0.2
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        scales: {
          y: {
            min: -105,
            max: -55,
            title: { display: true, text: "Received Power (dBm)", color: "#94a3b8" },
            grid: { color: "#334155" },
            ticks: { color: "#94a3b8" }
          },
          x: { display: false }
        },
        plugins: {
          legend: { labels: { color: "#f8fafc", font: { weight: "bold" } } }
        }
      }
    });

    // --- Math: Shortest distance from point to segment ---
    function distToSegment(px, py, x1, y1, x2, y2) {
      const l2 = (x2 - x1)**2 + (y2 - y1)**2;
      if (l2 === 0) return Math.hypot(px - x1, py - y1);
      let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
    }

    // --- Canvas & Drag Interactions ---
    const canvas = document.getElementById("scene");
    const sCtx = canvas.getContext("2d");

    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    function onPointerDown(e) {
      const pos = getCanvasCoords(e);
      if (Math.hypot(pos.x - obstacle.x, pos.y - obstacle.y) <= obstacle.radius + 12) {
        isDragging = true;
        dragOffset.x = pos.x - obstacle.x;
        dragOffset.y = pos.y - obstacle.y;
        canvas.classList.add("dragging");
      }
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      const pos = getCanvasCoords(e);
      obstacle.x = Math.max(30, Math.min(canvas.width - 30, pos.x - dragOffset.x));
      obstacle.y = Math.max(30, Math.min(canvas.height - 30, pos.y - dragOffset.y));
    }

    function onPointerUp() {
      isDragging = false;
      canvas.classList.remove("dragging");
    }

    canvas.addEventListener("mousedown", onPointerDown);
    window.addEventListener("mousemove", onPointerMove);
    window.addEventListener("mouseup", onPointerUp);

    canvas.addEventListener("touchstart", onPointerDown, { passive: true });
    window.addEventListener("touchmove", onPointerMove, { passive: true });
    window.addEventListener("touchend", onPointerUp);

    document.getElementById("resetBtn").onclick = () => {
      obstacle.x = 335;
      obstacle.y = 220;
    };

    // --- Animation & Continuous Simulation Loop ---
    function tick() {
      // 1. Calculate Blockage on BS 1
      const dBS1 = distToSegment(obstacle.x, obstacle.y, BS1.x, BS1.y - 20, UE.x, UE.y);
      let attenuationBS1 = 0;
      let isNLOS1 = false;
      if (dBS1 < 45) {
        attenuationBS1 = 32 * Math.exp(-0.5 * (dBS1 / 15)**2);
        if (attenuationBS1 > 8) isNLOS1 = true;
      }

      // Calculate Blockage on BS 2 (in case user drags over BS2 link as well)
      const dBS2 = distToSegment(obstacle.x, obstacle.y, BS2.x, BS2.y - 20, UE.x, UE.y);
      let attenuationBS2 = 0;
      if (dBS2 < 45) {
        attenuationBS2 = 32 * Math.exp(-0.5 * (dBS2 / 15)**2);
      }

      // Add small continuous channel noise
      const noise1 = (Math.random() - 0.5) * 1.0;
      const noise2 = (Math.random() - 0.5) * 1.0;

      const pBS1 = BS1.basePower - attenuationBS1 + noise1;
      const pBS2 = BS2.basePower - attenuationBS2 + noise2;

      // 2. Handover Decision with 2 dB hysteresis[cite: 1]
      const hysteresis = 2.0;
      if (activeBS === 1 && pBS2 > pBS1 + hysteresis) {
        activeBS = 2; // Handover to BS2[cite: 1]
      } else if (activeBS === 2 && pBS1 > pBS2 + hysteresis) {
        activeBS = 1; // Handover back to BS1[cite: 1]
      }

      // 3. Update Chart Continuously
      dataBS1.push(pBS1);
      dataBS1.shift();
      dataBS2.push(pBS2);
      dataBS2.shift();
      chart.update();

      // 4. Update UI Dashboard
      document.getElementById("stat-bs1").innerText = pBS1.toFixed(1) + " dBm";
      document.getElementById("stat-bs2").innerText = pBS2.toFixed(1) + " dBm";

      const activeLabel = document.getElementById("stat-active");
      activeLabel.innerText = activeBS === 1 ? "BS 1 (Primary)" : "BS 2 (Switched)";
      activeLabel.style.color = activeBS === 1 ? "#38bdf8" : "#f59e0b";

      const chanLabel = document.getElementById("stat-channel");
      chanLabel.innerText = isNLOS1 ? "BS 1 NLOS (Blocked)" : "BS 1 LOS (Clear)";
      chanLabel.style.color = isNLOS1 ? "#ef4444" : "#22c55e";

      // 5. Draw Canvas Scene
      renderScene(isNLOS1);

      requestAnimationFrame(tick);
    }

    // --- Render Base Stations, Receiver & Beams ---
    function drawTower(x, y, label, isActive, color, distLabel) {
      sCtx.save();
      // Tower Legs
      sCtx.strokeStyle = isActive ? color : "#64748b";
      sCtx.lineWidth = 3;
      sCtx.beginPath();
      sCtx.moveTo(x - 14, y + 25);
      sCtx.lineTo(x, y - 20);
      sCtx.lineTo(x + 14, y + 25);
      sCtx.stroke();

      // Horizontal Struts
      sCtx.beginPath();
      sCtx.moveTo(x - 9, y + 8);
      sCtx.lineTo(x + 9, y + 8);
      sCtx.moveTo(x - 5, y - 5);
      sCtx.lineTo(x + 5, y - 5);
      sCtx.stroke();

      // Antenna Emitter
      sCtx.fillStyle = color;
      sCtx.beginPath();
      sCtx.arc(x, y - 22, 6, 0, Math.PI * 2);
      sCtx.fill();

      // Emission Waves if serving
      if (isActive) {
        sCtx.strokeStyle = color;
        sCtx.lineWidth = 1.5;
        const phase = (Date.now() / 140) % 16;
        sCtx.beginPath();
        const dir = x < UE.x ? 1 : -1;
        sCtx.arc(x + (dir * 12), y - 22, 10 + phase, dir > 0 ? -Math.PI / 3 : (2 * Math.PI) / 3, dir > 0 ? Math.PI / 3 : (4 * Math.PI) / 3);
        sCtx.stroke();
      }

      sCtx.fillStyle = "#cbd5e1";
      sCtx.font = "bold 13px sans-serif";
      sCtx.textAlign = "center";
      sCtx.fillText(label, x, y + 42);
      sCtx.font = "11px sans-serif";
      sCtx.fillStyle = "#94a3b8";
      sCtx.fillText(distLabel, x, y + 56);
      sCtx.restore();
    }

    function renderScene(isNLOS1) {
      sCtx.clearRect(0, 0, canvas.width, canvas.height);

      // Link BS 1 -> UE
      sCtx.save();
      sCtx.setLineDash(activeBS === 1 ? [] : [5, 5]);
      sCtx.strokeStyle = activeBS === 1 ? (isNLOS1 ? "#ef4444" : "#0284c7") : "#334155";
      sCtx.lineWidth = activeBS === 1 ? 3.5 : 1.5;
      sCtx.beginPath();
      sCtx.moveTo(BS1.x, BS1.y - 20);
      sCtx.lineTo(UE.x, UE.y);
      sCtx.stroke();
      sCtx.restore();

      // Link BS 2 -> UE
      sCtx.save();
      sCtx.setLineDash(activeBS === 2 ? [] : [5, 5]);
      sCtx.strokeStyle = activeBS === 2 ? "#f59e0b" : "#334155";
      sCtx.lineWidth = activeBS === 2 ? 3.5 : 1.5;
      sCtx.beginPath();
      sCtx.moveTo(BS2.x, BS2.y - 20);
      sCtx.lineTo(UE.x, UE.y);
      sCtx.stroke();
      sCtx.restore();

      // Draw Towers
      drawTower(BS1.x, BS1.y, "BS 1", activeBS === 1, "#0284c7", "d = ~230m");
      drawTower(BS2.x, BS2.y, "BS 2", activeBS === 2, "#f59e0b", "d = ~335m");

      // Draw Obstacle (Draggable)
      sCtx.save();
      sCtx.fillStyle = isNLOS1 ? "#ef4444" : "#94a3b8";
      sCtx.shadowColor = isNLOS1 ? "#ef4444" : (isDragging ? "#38bdf8" : "transparent");
      sCtx.shadowBlur = isNLOS1 || isDragging ? 18 : 0;
      sCtx.beginPath();
      sCtx.arc(obstacle.x, obstacle.y, obstacle.radius, 0, Math.PI * 2);
      sCtx.fill();
      
      // Outline circle to indicate draggable target
      sCtx.strokeStyle = isDragging ? "#38bdf8" : "#f8fafc";
      sCtx.lineWidth = 2;
      sCtx.stroke();

      sCtx.fillStyle = "#ffffff";
      sCtx.font = "bold 12px sans-serif";
      sCtx.textAlign = "center";
      sCtx.fillText("Obstacle", obstacle.x, obstacle.y - obstacle.radius - 8);
      sCtx.restore();

      // Draw Receiver (UE) at Center
      sCtx.save();
      sCtx.fillStyle = "#38bdf8";
      sCtx.shadowColor = "#38bdf8";
      sCtx.shadowBlur = 10;
      sCtx.fillRect(UE.x - 12, UE.y - 20, 24, 40);
      sCtx.shadowBlur = 0;
      sCtx.fillStyle = "#0f172a";
      sCtx.fillRect(UE.x - 9, UE.y - 16, 18, 32);
      
      sCtx.fillStyle = "#f8fafc";
      sCtx.font = "bold 13px sans-serif";
      sCtx.textAlign = "center";
      sCtx.fillText("UE (Receiver)", UE.x, UE.y + 36);
      sCtx.restore();
    }

    tick();
  </script>
</body>
</html>
